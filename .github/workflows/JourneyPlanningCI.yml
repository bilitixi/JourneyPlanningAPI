name: Journey Planning CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Unitec123
          MYSQL_DATABASE: journey_planning
          MYSQL_USER: user
          MYSQL_PASSWORD: Unitec123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: Unitec123
      MYSQL_DATABASE: journey_planning
      JWT_SECRET_KEY: test-secret-key

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t journey-app .

      - name: Run application container
        run: |
          docker run -d \
            --name journey-app-container \
            -p 5000:5000 \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=user \
            -e MYSQL_PASSWORD=Unitec123 \
            -e MYSQL_DATABASE=journey_planning \
            -e JWT_SECRET_KEY=test-secret-key \
            journey-app

      - name: Wait for app startup
        run: sleep 10

      - name: Health check
        run: curl http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker stop journey-app-container


  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Unitec123
          MYSQL_DATABASE: journey_planning
          MYSQL_USER: user
          MYSQL_PASSWORD: Unitec123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: Unitec123
      MYSQL_DATABASE: journey_planning
      JWT_SECRET_KEY: test-secret-key

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t journey-app .

      - name: Run tests inside Docker container
        run: |
          docker run -d --name journey-test journey-app
          sleep 5
          docker exec journey-test pytest

      - name: Stop test container
        if: always()
        run: docker stop journey-test && docker rm journey-test
