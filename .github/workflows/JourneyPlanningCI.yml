name: Journey Planning CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:

# =========================
# BUILD JOB
# =========================
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: journey_planning
          MYSQL_USER: user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    env:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: journey_planning
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t journey-app:latest .

      # =========================
      # WAIT FOR MYSQL
      # =========================
      - name: Wait for MySQL
        run: |
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/40)"
            sleep 2
          done
          echo "MySQL failed"
          exit 1

      # =========================
      # RUN APP (IMPORTANT FIX HERE)
      # =========================
      - name: Run application container
        run: |
          docker run \
            --name journey-app-container \
            -p 5000:5000 \
            -e MYSQL_HOST=mysql \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=user \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            -e MYSQL_DATABASE=journey_planning \
            -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            -e OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} \
            journey-app:latest

      # =========================
      # DEBUG LOGS
      # =========================
      - name: Show logs
        if: always()
        run: docker logs journey-app-container || true

      - name: Show container status
        if: always()
        run: docker ps -a


# =========================
# TEST JOB
# =========================
  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: journey_planning
          MYSQL_USER: user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    env:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: journey_planning
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # WAIT FOR MYSQL
      # =========================
      - name: Wait for MySQL
        run: |
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/40)"
            sleep 2
          done
          echo "MySQL failed"
          exit 1

      # =========================
      # INIT DB
      # =========================
      - name: Initialize database
        run: python -c "from db import init_db; init_db()"
        env:
          MYSQL_HOST: mysql
          MYSQL_PORT: 3306
          MYSQL_USER: user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: journey_planning

      # =========================
      # RUN TESTS
      # =========================
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          MYSQL_HOST: mysql
          MYSQL_PORT: 3306
          MYSQL_USER: user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: journey_planning
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
